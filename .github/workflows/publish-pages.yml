name: Publish fund observatory
on:
  workflow_dispatch:
    inputs:
      deploy:
        description: Publish to the live Pages site
        type: boolean
        default: false
  push:
    branches: [main]
    paths: [index.html, app.js, app.css, snapshot.json, .nojekyll]
permissions:
  contents: read
concurrency:
  group: fund-observer-pages
  cancel-in-progress: false
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate and package public assets
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          files = ('index.html', 'app.js', 'app.css', 'snapshot.json', '.nojekyll')
          snapshot = json.loads(Path('snapshot.json').read_text(encoding='utf-8'))
          points = snapshot['points']
          assert points and points[-1]['date'] == snapshot['latest_date']
          target = Path('_site')
          target.mkdir()
          for file in files:
              (target / file).write_bytes(Path(file).read_bytes())
          print(f"Latest NAV date: {snapshot['latest_date']}; records: {len(points)}")
          PY
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site
  deploy:
    if: github.event_name == 'push' || inputs.deploy
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: publish
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
